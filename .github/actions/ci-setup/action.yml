name: Prepare Docs CI workspace
description: Install the frozen registry graph and matching Chromium inside the job container.
inputs:
  browsers:
    description: Install Chromium for the locked Playwright version.
    default: "false"
runs:
  using: composite
  steps:
    - name: Trust the container checkout
      shell: bash
      run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
    - name: Select the pinned pnpm version
      shell: bash
      run: corepack prepare "$(node -p 'require("./package.json").packageManager')" --activate
    - name: Restore the container pnpm store
      uses: actions/cache@v5
      with:
        path: /tmp/lapis-docs-pnpm
        key: docs-pnpm-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pnpm-lock.yaml', '.ci/images.json') }}
        restore-keys: |
          docs-pnpm-${{ runner.os }}-${{ runner.arch }}-
    - name: Install frozen registry dependencies
      shell: bash
      run: pnpm install --frozen-lockfile --ignore-pnpmfile --prefer-offline --store-dir=/tmp/lapis-docs-pnpm
    - name: Install matching headless Chromium
      if: inputs.browsers == 'true'
      uses: actions/cache@v5
      id: browsers
      with:
        path: /tmp/lapis-docs-browsers
        key: docs-chromium-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pnpm-lock.yaml', '.ci/images.json') }}
    - name: Prepare the locked browser
      if: inputs.browsers == 'true'
      shell: bash
      run: node scripts/ci-browser.mjs
