name: CI and npm release

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: read

defaults:
  run:
    shell: bash

concurrency:
  group: docs-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  # The same pinned lapis-ci image Tasks and Notebook use, with native lanes
  # inside the isolated job container.
  COREPACK_HOME: /tmp/lapis-docs-corepack
  PLAYWRIGHT_BROWSERS_PATH: /tmp/lapis-docs-browsers

jobs:
  image-pin:
    runs-on: ubuntu-latest
    outputs:
      reference: ${{ steps.image.outputs.reference }}
    steps:
      - uses: actions/checkout@v7
      - name: Resolve the pinned CI image
        id: image
        run: |
          set -euo pipefail
          reference="$(jq -er '.base | select(.image and (.digest | test("^sha256:[a-f0-9]{64}$"))) | .image + "@" + .digest' .ci/images.json)"
          echo "reference=$reference" >> "$GITHUB_OUTPUT"

  build-cache:
    needs: image-pin
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container:
      image: ${{ needs.image-pin.outputs.reference }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
      options: --user=1001:1001 --init --cap-drop=ALL --cpus=4 --memory=7g --shm-size=2g
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/ci-setup
      - name: Build the package
        run: pnpm build

  quality:
    needs: [image-pin, build-cache]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container:
      image: ${{ needs.image-pin.outputs.reference }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
      options: --user=1001:1001 --init --cap-drop=ALL --cpus=4 --memory=7g --shm-size=2g
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: ./.github/actions/ci-setup
      - name: Install the pinned Jujutsu bootstrap
        run: node scripts/validation/install-tools.mjs --ci
      - name: Select the exact CI source revision
        run: |
          jj git init --colocate .
          jj --ignore-immutable edit "$GITHUB_SHA"
      - run: pnpm validation:check
      - run: pnpm spec:check
      - name: Run quality checks
        run: pnpm check

  unit:
    needs: [image-pin, build-cache]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container:
      image: ${{ needs.image-pin.outputs.reference }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
      options: --user=1001:1001 --init --cap-drop=ALL --cpus=4 --memory=7g --shm-size=2g
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/ci-setup
      - name: Run all unit tests
        run: pnpm test

  package:
    needs: [image-pin, build-cache]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container:
      image: ${{ needs.image-pin.outputs.reference }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
      options: --user=1001:1001 --init --cap-drop=ALL --cpus=4 --memory=7g --shm-size=2g
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/ci-setup
      - name: Build and audit the public package
        run: pnpm build
      - run: pnpm exec publint
      - name: Prepare the immutable npm artifact
        run: pnpm release:prepare
        env:
          LAPIS_DOCS_RELEASE_PREPARE: "1"
      - uses: actions/upload-artifact@v7
        with:
          name: docs-npm-${{ github.sha }}
          path: .release/
          include-hidden-files: true
          if-no-files-found: error

  storybook-static:
    needs: [image-pin, build-cache]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container:
      image: ${{ needs.image-pin.outputs.reference }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
      options: --user=1001:1001 --init --cap-drop=ALL --cpus=4 --memory=7g --shm-size=2g
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/ci-setup
      - run: pnpm build-storybook
        env:
          NODE_OPTIONS: --max-old-space-size=6144

  storybook-interaction:
    needs: [image-pin, build-cache]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    container:
      image: ${{ needs.image-pin.outputs.reference }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
      options: --user=1001:1001 --init --cap-drop=ALL --cpus=4 --memory=7g --shm-size=2g
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/ci-setup
        with:
          browsers: "true"
      - run: pnpm validation:smoke
      - name: Run interaction and accessibility shard
        run: pnpm test:storybook -- --shard=${{ matrix.shard }}/3

  validate:
    name: Validation lanes
    if: always()
    needs:
      [
        image-pin,
        build-cache,
        quality,
        unit,
        package,
        storybook-static,
        storybook-interaction,
      ]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Aggregate all blocking lanes
        env:
          CI_JOB_RESULTS: ${{ toJSON(needs) }}
        run: node scripts/aggregate-ci.mjs

  changesets:
    name: Version packages
    needs: validate
    if: needs.validate.result == 'success' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      hasChangesets: ${{ steps.changesets.outputs.hasChangesets }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-pnpmfile
      - id: changesets
        uses: changesets/action@v1.8.0
        with:
          version: pnpm release:version
          commitMode: github-api
          title: "chore: version Docs package"
          commit: "chore: version Docs package"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish:
    name: Publish and verify npm release
    needs: [validate, changesets]
    if: needs.validate.result == 'success' && needs.changesets.result == 'success' && github.ref == 'refs/heads/main' && needs.changesets.outputs.hasChangesets != 'true'
    runs-on: ubuntu-latest
    environment: npm-production
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies and current npm
        run: |
          pnpm install --frozen-lockfile --ignore-pnpmfile
          npm install --global npm@12.0.2
      - uses: actions/download-artifact@v8
        with:
          name: docs-npm-${{ github.sha }}
          path: .release
      - name: Sign and verify npm-compatible provenance for the qualified artifact
        run: pnpm release:attest
      - name: Check inherited release credentials without exposing them
        run: |
          if [ -n "$NODE_AUTH_TOKEN" ]; then
            npm whoami --registry=https://registry.npmjs.org
          else
            echo "No inherited token; npm will use the configured trusted publisher."
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - run: pnpm release:publish
        env:
          LAPIS_DOCS_RELEASE_APPROVED: "1"
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: docs-registry-receipt-${{ github.sha }}
          path: .release/
          include-hidden-files: true
          if-no-files-found: error
