name: CI and npm release

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: read

defaults:
  run:
    shell: bash

concurrency:
  group: docs-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  # The same pinned lapis-ci image Tasks and Notebook use, with native lanes
  # inside the isolated job container.
  COREPACK_HOME: /tmp/lapis-docs-corepack
  PLAYWRIGHT_BROWSERS_PATH: /tmp/lapis-docs-browsers

jobs:
  image-pin:
    runs-on: ubuntu-latest
    outputs:
      reference: ${{ steps.image.outputs.reference }}
    steps:
      - uses: actions/checkout@v7
      - name: Resolve the pinned CI image
        id: image
        run: |
          set -euo pipefail
          reference="$(jq -er '.base | select(.image and (.digest | test("^sha256:[a-f0-9]{64}$"))) | .image + "@" + .digest' .ci/images.json)"
          echo "reference=$reference" >> "$GITHUB_OUTPUT"

  build-cache:
    needs: image-pin
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container:
      image: ${{ needs.image-pin.outputs.reference }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
      options: --user=1001:1001 --init --cap-drop=ALL --cpus=4 --memory=7g --shm-size=2g
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/ci-setup
      - name: Build the package
        run: pnpm build

  quality:
    needs: [image-pin, build-cache]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container:
      image: ${{ needs.image-pin.outputs.reference }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
      options: --user=1001:1001 --init --cap-drop=ALL --cpus=4 --memory=7g --shm-size=2g
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: ./.github/actions/ci-setup
      - name: Audit the exact full dependency graph
        uses: lapismd/lapis-ci/actions/check-development-audit@2c756d802f95777a33980b8b1e74f6986498d86e # reviewed exact-policy collector
        with:
          policy-file: .github/development-audit.json
      - name: Install the pinned Jujutsu bootstrap
        run: node scripts/validation/install-tools.mjs --ci
      - name: Select the exact CI source revision
        run: |
          jj git init --colocate .
          jj --ignore-immutable edit "$GITHUB_SHA"
      - run: pnpm validation:check
      - run: pnpm spec:check
      - name: Run quality checks
        run: pnpm check
      - name: Retain dependency audit evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7, Node24
        with:
          name: docs-dependency-audit-${{ github.run_id }}-${{ github.run_attempt }}
          path: .local/dependency-audit/
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 14

  unit:
    needs: [image-pin, build-cache]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container:
      image: ${{ needs.image-pin.outputs.reference }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
      options: --user=1001:1001 --init --cap-drop=ALL --cpus=4 --memory=7g --shm-size=2g
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/ci-setup
      - name: Run all unit tests
        run: pnpm test

  package:
    needs: [image-pin, build-cache]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container:
      image: ${{ needs.image-pin.outputs.reference }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
      options: --user=1001:1001 --init --cap-drop=ALL --cpus=4 --memory=7g --shm-size=2g
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/ci-setup
      - name: Build and audit the public package
        run: pnpm build
      - run: pnpm exec publint
      - name: Audit production dependencies
        run: pnpm audit --prod
      - name: Prepare the immutable npm artifact
        run: pnpm release:prepare
        env:
          LAPIS_DOCS_RELEASE_PREPARE: "1"
      - uses: actions/upload-artifact@v7
        with:
          name: docs-npm-${{ github.sha }}
          path: .release/
          include-hidden-files: true
          if-no-files-found: error

  storybook-static:
    needs: [image-pin, build-cache]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container:
      image: ${{ needs.image-pin.outputs.reference }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
      options: --user=1001:1001 --init --cap-drop=ALL --cpus=4 --memory=7g --shm-size=2g
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/ci-setup
      - run: pnpm build-storybook
        env:
          NODE_OPTIONS: --max-old-space-size=6144

  storybook-interaction:
    needs: [image-pin, build-cache]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    container:
      image: ${{ needs.image-pin.outputs.reference }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
      options: --user=1001:1001 --init --cap-drop=ALL --cpus=4 --memory=7g --shm-size=2g
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/ci-setup
        with:
          browsers: "true"
      - run: pnpm validation:smoke
      - name: Run interaction and accessibility shard
        run: pnpm test:storybook -- --shard=${{ matrix.shard }}/3

  validate:
    name: Validation lanes
    if: always()
    needs:
      [
        image-pin,
        build-cache,
        quality,
        unit,
        package,
        storybook-static,
        storybook-interaction,
      ]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Aggregate all blocking lanes
        env:
          CI_JOB_RESULTS: ${{ toJSON(needs) }}
        run: node scripts/aggregate-ci.mjs

  changesets:
    name: Version packages
    needs: validate
    if: github.repository == 'lapismd/lapis-plugin-docs' && needs.validate.result == 'success' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      hasChangesets: ${{ steps.changesets.outputs.hasChangesets }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile --strict-peer-dependencies --ignore-pnpmfile
      - name: Guard the qualified source-owned Node version recipe
        uses: lapismd/lapis-ci/actions/guard-version-runtime@7242eb3bf246c266ba4a48c50eaaf01c2950a37d # reviewed whole-recipe proof
        with:
          qualification-file: .github/versioning-runtime.json
      - name: Mint repository-scoped version PR token
        id: app
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3
        with:
          client-id: ${{ vars.LAPIS_DEPENDENCY_APP_CLIENT_ID }}
          private-key: ${{ secrets.LAPIS_DEPENDENCY_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
          permission-pull-requests: write
      - id: changesets
        uses: changesets/action@63a615b9cd06ba9a3e6d13796c7fbcb080a60a0b # v1.8.0
        with:
          version: pnpm release:version
          commitMode: github-api
          createGithubReleases: false
          title: "chore: version Docs package"
          commit: "chore: version Docs package"
        env:
          GITHUB_TOKEN: ${{ steps.app.outputs.token }}

  publish:
    name: Publish and verify npm release
    needs: [validate, changesets]
    if: needs.validate.result == 'success' && needs.changesets.result == 'success' && github.ref == 'refs/heads/main' && needs.changesets.outputs.hasChangesets != 'true'
    runs-on: ubuntu-latest
    environment: npm-production
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies and current npm
        run: |
          pnpm install --frozen-lockfile --strict-peer-dependencies --ignore-pnpmfile
          npm install --global npm@12.0.2
      - uses: actions/download-artifact@v8
        with:
          name: docs-npm-${{ github.sha }}
          path: .release
      - name: Prepare source-pinned registry installation readiness
        uses: lapismd/lapis-ci/actions/setup-registry-readiness@c9fed365342109997587bd9a5a3b63066e8373aa # reviewed shared npm12 strict-peer source
      - name: Sign and verify npm-compatible provenance for the qualified artifact
        run: pnpm release:attest
      - name: Check inherited release credentials without exposing them
        run: |
          if [ -n "$NODE_AUTH_TOKEN" ]; then
            npm whoami --registry=https://registry.npmjs.org
          else
            echo "No inherited token; npm will use the configured trusted publisher."
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - run: pnpm release:publish
        env:
          LAPIS_DOCS_RELEASE_APPROVED: "1"
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: docs-registry-receipt-${{ github.sha }}
          path: .release/
          include-hidden-files: true
          if-no-files-found: error
  notify-dependencies:
    name: Notify dependency consumers
    needs: [publish]
    if: always() && needs.publish.result == 'success'
    permissions:
      contents: read
    uses: lapismd/dependency-automation/.github/workflows/notify.yml@1dabde27f674f92262a962d27efa2b50f0b59d34
    with:
      automation-ref: 1dabde27f674f92262a962d27efa2b50f0b59d34
      source-sha: ${{ github.sha }}
    secrets:
      app-private-key: ${{ secrets.LAPIS_DEPENDENCY_APP_PRIVATE_KEY }}
